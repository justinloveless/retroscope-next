name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Pushes to main are never cancelled: each commit's run gates
# its deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: AOT inputs
        id: aot
        run: echo "key=$(./build.sh aot-key)" >> "$GITHUB_OUTPUT"

      # aot-smoke reuses the server binary when nothing it is compiled from changed (build.sh aot_key).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/aot-cache
          key: aot-server-${{ steps.aot.outputs.key }}

      - name: Test
        run: ./build.sh test
        env:
          RS_JOBS: "0"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Web build
        run: ./build.sh web

      - name: Generated files are current
        run: git diff --exit-code

      - name: AOT smoke
        run: ./build.sh aot-smoke

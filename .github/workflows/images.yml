name: images

# Builds the app and importer images on GitHub-hosted runners and pushes them to GHCR, tagged with the commit SHA; the
# Coolify compose file references them by digest only (DESIGN §i.1, F1). deploy.yml waits for these images after ci
# passes on main; preview.yml calls this workflow for a pull request's head commit.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build. The images are tagged with it.
        type: string
        required: true
    outputs:
      sha:
        description: The commit the images were built from.
        value: ${{ jobs.images.outputs.sha }}
      app_digest:
        description: App image digest, hex without "sha256:".
        value: ${{ jobs.images.outputs.app_digest }}
      importer_digest:
        description: Importer image digest, hex without "sha256:".
        value: ${{ jobs.images.outputs.importer_digest }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.names.outputs.sha }}
      app_digest: ${{ steps.digests.outputs.app }}
      importer_digest: ${{ steps.digests.outputs.importer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: AOT smoke
        run: ./build.sh aot-smoke

      - name: Image names
        id: names
        run: |
          # Tag with the commit actually checked out: under workflow_call, github.sha is the caller's (for a
          # pull request, the merge commit), not the commit being built.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "app=ghcr.io/$owner/retroscope" >> "$GITHUB_OUTPUT"
          echo "importer=ghcr.io/$owner/retroscope-import" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.app }}:${{ steps.names.outputs.sha }}

      - name: Build and push importer
        id: importer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.importer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.importer }}:${{ steps.names.outputs.sha }}

      - name: Digests
        id: digests
        env:
          SHA: ${{ steps.names.outputs.sha }}
          APP: ${{ steps.names.outputs.app }}
          IMPORTER: ${{ steps.names.outputs.importer }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          IMPORTER_DIGEST: ${{ steps.importer.outputs.digest }}
        run: |
          for d in "$APP_DIGEST" "$IMPORTER_DIGEST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$d'"; exit 1; }
          done
          echo "app=${APP_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          echo "importer=${IMPORTER_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          {
            echo "commit: $SHA"
            echo "app: $APP@$APP_DIGEST"
            echo "importer: $IMPORTER@$IMPORTER_DIGEST"
          } | tee -a "$GITHUB_STEP_SUMMARY"

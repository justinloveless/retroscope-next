name: deploy

# Production release (deploy/COOLIFY_SETUP.md §11). When ci passes on a push to main, wait for images.yml to push that
# commit's images, point the production Coolify resource at their digests, deploy, and check health. A manual run
# redeploys any commit whose ci run on main passed, for example to roll back.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose ci run on main passed
        type: string
        required: true

permissions: {}

# One production deploy at a time, never cancelled half-way. GitHub keeps only the newest pending run.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs must start from main, so the workflow and script that hold the token are the reviewed ones.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout and the commits API
      actions: read # look up ci runs for a manual redeploy
      packages: read # resolve image digests in GHCR
    steps:
      - name: Target commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            sha="$INPUT_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lower-case commit SHA"; exit 1; }
            passed="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main&status=success&per_page=1" --jq '.total_count')"
            [[ "$passed" =~ ^[1-9] ]] || { echo "::error::no successful ci run on a push to main for $sha"; exit 1; }
          else
            sha="$RUN_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected head_sha"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ci and images.yml both start on the push, and images.yml usually finishes later.
      - name: Wait for the images
        id: images
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          deadline=$((SECONDS + 25 * 60))
          digest() {
            docker buildx imagetools inspect "ghcr.io/$owner/$1:$SHA" --format '{{json .Manifest}}' 2>/dev/null \
              | jq -r '.digest // empty'
          }
          while :; do
            app="$(digest retroscope || true)"
            importer="$(digest retroscope-import || true)"
            if [[ "$app" =~ ^sha256:[0-9a-f]{64}$ && "$importer" =~ ^sha256:[0-9a-f]{64}$ ]]; then break; fi
            if ((SECONDS >= deadline)); then
              echo "::error::images for $SHA did not appear in GHCR within 25 minutes; check the images workflow run"
              exit 1
            fi
            echo "waiting for ghcr.io/$owner/retroscope{,-import}:$SHA"
            sleep 30
          done
          echo "app=${app#sha256:}" >> "$GITHUB_OUTPUT"
          echo "importer=${importer#sha256:}" >> "$GITHUB_OUTPUT"
          echo "app $app, importer $importer"

      # ci runs can finish out of order. An automatic deploy of a commit that main has moved past is skipped: the newer
      # commit's own ci run deploys it. A manual run deploys exactly what was asked for.
      - name: Still the newest commit on main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          tip="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          if [[ "$EVENT" == workflow_run && "$tip" != "$SHA" ]]; then
            echo "::notice::main has moved on to $tip; skipping $SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fresh.outputs.skip == 'false'
        with:
          persist-credentials: false

      - name: Deploy to production
        id: deploy
        if: steps.fresh.outputs.skip == 'false'
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.PROD_APP_UUID }}
          PROD_URL: ${{ vars.PROD_URL }}
          GIT_BRANCH: main
          APP_DIGEST: ${{ steps.images.outputs.app }}
          IMPORTER_DIGEST: ${{ steps.images.outputs.importer }}
        run: HEALTH_URL="${PROD_URL%/}/healthz" deploy/coolify-deploy.sh deploy

      - name: Summary
        if: always() && steps.target.outputs.sha != ''
        env:
          SHA: ${{ steps.target.outputs.sha }}
          APP_DIGEST: ${{ steps.images.outputs.app }}
          IMPORTER_DIGEST: ${{ steps.images.outputs.importer }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment_uuid }}
          SKIPPED: ${{ steps.fresh.outputs.skip }}
          STATUS: ${{ job.status }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          if [[ "$SKIPPED" == true ]]; then result="skipped: main has a newer commit"; else result="$STATUS"; fi
          {
            echo "## Production deploy: $result"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $PROD_URL |"
            echo "| Commit | \`$SHA\` |"
            echo "| App digest | \`${APP_DIGEST:-not resolved}\` |"
            echo "| Importer digest | \`${IMPORTER_DIGEST:-not resolved}\` |"
            echo "| Coolify deployment | \`${DEPLOYMENT:-none}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
